<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitlMatrix</title>
  </head>
  <body>
    <main id="app">
      <h1>LitlMatrix</h1>
      <p id="status">Connecting to ChatGPT…</p>
      <section class="panel">
        <label>Review title <input id="review-title" type="text" placeholder="Systematic review title" /></label>
        <label>Scopus / WoS export <input id="record-file" type="file" accept=".csv,.ris,.bib,.bibtex,.txt" /></label>
        <button id="import-button" disabled>Start review & import records</button>
        <div id="counts" class="counts"></div>
        <p class="hint">Records stay bounded to the researcher's supplied evidence. The app does not add external literature or require an AI API key.</p>
      </section>
    </main>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
